<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="mGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    
    <!-- 内发光 -->
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 背景 - 圆角矩形 -->
  <rect 
    x="64" y="64" 
    width="896" height="896" 
    rx="180" ry="180"
    fill="url(#bgGradient)"
    filter="url(#shadow)"
  />
  
  <!-- 内部装饰圆 -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15"/>
  <circle cx="512" cy="512" r="280" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
  
  <!-- M 字母 - 现代简约风格 -->
  <g transform="translate(512, 512)">
    <!-- M 的三个部分 -->
    <path 
      d="M -180 -200 L -180 200 L -120 200 L -120 0 L 0 200 L 120 0 L 120 200 L 180 200 L 180 -200 L 120 -200 L 0 50 L -120 -200 Z"
      fill="url(#mGradient)"
      filter="url(#innerGlow)"
      stroke="#ffffff"
      stroke-width="8"
      stroke-opacity="0.3"
    />
  </g>
  
  <!-- 编辑符号 - 笔/铅笔图标 -->
  <g transform="translate(750, 750)">
    <path 
      d="M 0 -60 L 40 -20 L 0 60 L -40 -20 Z"
      fill="#ffffff"
      fill-opacity="0.8"
    />
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#6366f1" stroke-width="4"/>
  </g>
  
  <!-- Markdown 符号指示 # -->
  <g transform="translate(274, 274)" fill="#ffffff" fill-opacity="0.6">
    <rect x="-20" y="-40" width="10" height="80"/>
    <rect x="10" y="-40" width="10" height="80"/>
    <rect x="-40" y="-20" width="80" height="8"/>
    <rect x="-40" y="12" width="80" height="8"/>
  </g>
</svg>