name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Markhere ${{ github.ref_name }}
          body: |
            ## 📦 Markhere ${{ github.ref_name }}
            
            ### 下载说明
            
            | 平台 | 文件 | 说明 |
            |------|------|------|
            | **Linux** | `*.deb` 或 `*.AppImage` | Ubuntu/Debian (x86_64) |
            
            ### 系统要求
            
            - Ubuntu 18.04+ / Debian 10+ (64-bit)
            
            ### ⚠️ macOS/Windows
            
            当前仅提供 Linux 版本。如需其他平台：
            
            ```bash
            # 本地构建
            git clone https://github.com/jacksoncode/Markhere.git
            cd Markhere && npm install && npm run tauri:build
            ```
            
            详见 [CONTRIBUTING.md](../CONTRIBUTING.md)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Dependencies
        run: npm ci

      - name: Build Linux
        run: npx tauri build

      - name: Upload Linux Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}