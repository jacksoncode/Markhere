name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build Tauri app (Windows)
        if: matrix.os == 'windows-latest'
        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_NET_RETRY: '5'
        run: npx tauri build --target ${{ matrix.target }}

      - name: Build Tauri app (macOS/Linux)
        if: matrix.os != 'windows-latest'
        env:
          CARGO_NET_RETRY: '5'
        run: npx tauri build --target ${{ matrix.target }}

      # ---- Windows CI 无头环境：静态检查构建产物（无法启动 GUI app）
      - name: Verify Windows build artifacts
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          $binary = Get-ChildItem "src-tauri/target" -Recurse -Filter "markhere.exe" |
            Where-Object { $_.FullName -match 'release' } |
            Select-Object -First 1
          if (-not $binary) {
            Write-Host "WARNING: Binary not found (headless CI cannot launch GUI apps)"
            Get-ChildItem "src-tauri/target" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
            exit 0
          }
          $sizeMB = [math]::Round($binary.Length / 1MB, 2)
          Write-Host "Binary: $($binary.FullName) (${sizeMB} MB)"
          $buildTime = (Get-Item $binary.FullName).LastWriteTime.ToString("yyyy-MM-dd HH:mm:ss")
          Write-Host "Build time: ${buildTime}"

          $msiFiles = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          $exeBundles = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          Write-Host "MSI installers: $($msiFiles.Count)"
          Write-Host "NSIS bundles: $($exeBundles.Count)"
          foreach ($f in ($msiFiles + $exeBundles)) { Write-Host "  - $($f.Name) ($([math]::Round($f.Length/1MB,2)) MB)" }

          if ($sizeMB -lt 2) {
            Write-Host "WARNING: Binary size suspiciously small (${sizeMB} MB)"
          } else {
            Write-Host "PASSED: Build artifacts verified (headless CI, no GUI launch)"
          }
          exit 0

      # ---- Upload artifacts BEFORE WebDriver (so they're available even if WebDriver fails) ----
      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-linux
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-macos
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: markhere-windows
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore

