name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}

      # ---- Plan A: Windows smoke test (launch binary, verify 20s stability) ----
      - name: Smoke test - launch app and verify stability
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          RUST_BACKTRACE: full
        run: |
          $ErrorActionPreference = "Stop"
          trap { Write-Host "SCRIPT ERROR: $_"; exit 1 }
          $binary = Get-ChildItem "src-tauri/target" -Recurse -Filter "markhere.exe" |
            Where-Object { $_.FullName -match 'release' } |
            Select-Object -First 1
          if (-not $binary) {
            Write-Host "ERROR: Binary not found"
            Get-ChildItem "src-tauri/target" -Recurse -Filter "*.exe" | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "Binary: $($binary.FullName) ($([math]::Round($binary.Length/1MB,2)) MB)"
          Set-Location $binary.DirectoryName
          $wv2 = Get-Item "C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if ($wv2) { Write-Host "WebView2: $($wv2.VersionInfo.FileVersion)" }
          else { Write-Host "WebView2 NOT found at standard path (Tauri uses its own detection)" }

          $stderrLog = Join-Path $env:RUNNER_TEMP "markhere-stderr.log"
          $stdoutLog = Join-Path $env:RUNNER_TEMP "markhere-stdout.log"
          Write-Host "Launching from $(Get-Location)..."
          $proc = Start-Process -FilePath $binary.FullName -PassThru `
            -RedirectStandardError $stderrLog -RedirectStandardOutput $stdoutLog
          Write-Host "PID: $($proc.Id)"

          # Poll every 5s up to 20s
          $stable = $false
          for ($i = 5; $i -le 20; $i += 5) {
            Start-Sleep -Seconds 5
            if ($proc.HasExited) {
              $elapsed = [math]::Round(($proc.ExitTime - $proc.StartTime).TotalSeconds, 1)
              Write-Host "!!! CRASHED after ${elapsed}s, exit code: $($proc.ExitCode)"
              Write-Host "--- STDERR ---"
              if ((Test-Path $stderrLog) -and ((Get-Item $stderrLog).Length -gt 0)) { Get-Content $stderrLog | ForEach-Object { Write-Host $_ } } else { Write-Host "(empty)" }
              Write-Host "--- STDOUT ---"
              if ((Test-Path $stdoutLog) -and ((Get-Item $stdoutLog).Length -gt 0)) { Get-Content $stdoutLog | ForEach-Object { Write-Host $_ } } else { Write-Host "(empty)" }
              exit 1
            }
            Write-Host "  Still running at ${i}s..."
            if ($i -ge 20) { $stable = $true }
          }

          Write-Host "PASSED: App stable for 20+ seconds"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Upload smoke test logs
        if: matrix.os == 'windows-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-test-logs
          path: |
            ${{ runner.temp }}/markhere-stderr.log
            ${{ runner.temp }}/markhere-stdout.log
          if-no-files-found: ignore

      # ---- Upload artifacts BEFORE WebDriver (so they're available even if WebDriver fails) ----
      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-linux
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-macos
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-windows
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore

      # ---- Plan B: WebDriver E2E test against real Windows WebView2 ----
      - name: Install tauri-driver
        if: matrix.os == 'windows-latest'
        run: cargo install tauri-driver --locked

      - name: WebDriver E2E test
        id: webdriver
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          $binary = Get-ChildItem "src-tauri/target" -Recurse -Filter "markhere.exe" |
            Where-Object { $_.FullName -match 'release' } |
            Select-Object -First 1
          if (-not $binary) {
            Write-Host "Cannot find binary for WebDriver test"
            exit 1
          }
          Write-Host "WebDriver app: $($binary.FullName)"
          $env:TAURI_DRIVER_APP_PATH = $binary.FullName
          node e2e/webdriver-test.mjs
