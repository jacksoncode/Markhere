name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}

      # ---- Plan A: Windows smoke test (launch binary directly, verify stability) ----
      - name: Smoke test - launch app and verify stability
        id: smoke
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        env:
          RUST_BACKTRACE: full
        run: |
          $ErrorActionPreference = "Continue"
          $binary = Get-ChildItem "src-tauri/target" -Recurse -Filter "markhere.exe" |
            Where-Object { $_.FullName -match 'release' } |
            Select-Object -First 1
          if (-not $binary) {
            Write-Host "ERROR: Binary not found. Searching all exes..."
            Get-ChildItem "src-tauri/target" -Recurse -Filter "*.exe" | ForEach-Object { Write-Host "  $($_.FullName)" }
            "BINARY_NOT_FOUND" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "smoke-result.txt")
            exit 1
          }
          Write-Host "Binary: $($binary.FullName) ($([math]::Round($binary.Length/1MB,2)) MB)"

          $stderrLog = Join-Path $env:RUNNER_TEMP "markhere-stderr.log"
          $stdoutLog = Join-Path $env:RUNNER_TEMP "markhere-stdout.log"
          Set-Location $binary.DirectoryName

          # WebView2 check
          $wv2 = Get-Item "C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if ($wv2) { Write-Host "WebView2: $($wv2.VersionInfo.FileVersion)" }
          else { Write-Host "WebView2 NOT found at standard path" }

          # Launch app
          Write-Host "CWD: $(Get-Location)"
          $proc = Start-Process -FilePath $binary.FullName -PassThru `
            -RedirectStandardError $stderrLog `
            -RedirectStandardOutput $stdoutLog `
            -WorkingDirectory $binary.DirectoryName

          Write-Host "PID: $($proc.Id), waiting 12s..."
          Start-Sleep -Seconds 12

          if ($proc.HasExited) {
            $elapsed = [math]::Round(($proc.ExitTime - $proc.StartTime).TotalSeconds, 1)
            Write-Host "!!! CRASHED after ${elapsed}s, exit code: $($proc.ExitCode)"
            "CRASHED_$($proc.ExitCode)" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "smoke-result.txt")
          } else {
            Write-Host "PASSED: App running for 12+ seconds"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            "PASSED" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "smoke-result.txt")
          }

          # Always print diagnostics
          Write-Host "=== STDERR ==="
          if ((Test-Path $stderrLog) -and ((Get-Item $stderrLog).Length -gt 0)) {
            Get-Content $stderrLog -Tail 50 | ForEach-Object { Write-Host $_ }
          } else { Write-Host "(empty)" }
          Write-Host "=== STDOUT ==="
          if ((Test-Path $stdoutLog) -and ((Get-Item $stdoutLog).Length -gt 0)) {
            Get-Content $stdoutLog -Tail 50 | ForEach-Object { Write-Host $_ }
          } else { Write-Host "(empty)" }

      - name: Upload smoke test logs
        if: matrix.os == 'windows-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-test-logs
          path: |
            ${{ runner.temp }}/markhere-stderr.log
            ${{ runner.temp }}/markhere-stdout.log
            ${{ runner.temp }}/smoke-result.txt
          if-no-files-found: ignore

      - name: Check smoke test result
        if: matrix.os == 'windows-latest' && always()
        shell: pwsh
        run: |
          $resultFile = Join-Path $env:RUNNER_TEMP "smoke-result.txt"
          if (-not (Test-Path $resultFile)) {
            Write-Host "No smoke result file — assuming failure"
            exit 1
          }
          $result = Get-Content $resultFile -Raw
          Write-Host "Smoke test result: $result"
          if ($result -notmatch 'PASSED') {
            Write-Host "Smoke test failed: $result"
            exit 1
          }

      # ---- Upload artifacts BEFORE WebDriver (so they're available even if WebDriver fails) ----
      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-linux
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-macos
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-windows
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore

      # ---- Plan B: WebDriver E2E test against real Windows WebView2 ----
      - name: Install tauri-driver
        if: matrix.os == 'windows-latest'
        run: cargo install tauri-driver --locked

      - name: WebDriver E2E test
        id: webdriver
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          $binary = Get-ChildItem "src-tauri/target" -Recurse -Filter "markhere.exe" |
            Where-Object { $_.FullName -match 'release' } |
            Select-Object -First 1
          if (-not $binary) {
            Write-Host "Cannot find binary for WebDriver test"
            exit 1
          }
          Write-Host "WebDriver app: $($binary.FullName)"
          $env:TAURI_DRIVER_APP_PATH = $binary.FullName
          node e2e/webdriver-test.mjs
