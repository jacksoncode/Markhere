name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}

      # ---- Plan A: Windows smoke test (launch binary directly, verify stability) ----
      - name: Smoke test - launch app and verify stability
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Find the built binary
          $binary = Get-ChildItem "src-tauri/target" -Recurse -Filter "markhere.exe" |
            Where-Object { $_.FullName -match 'release' } |
            Select-Object -First 1
          if (-not $binary) {
            Write-Host "ERROR: markhere.exe not found in build output"
            Write-Host "Searching all exes..."
            Get-ChildItem "src-tauri/target" -Recurse -Filter "*.exe" | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          Write-Host "Found binary: $($binary.FullName)"
          Write-Host "Size: $([math]::Round($binary.Length / 1MB, 2)) MB"
          Write-Host "Launching Markhere..."
          $proc = Start-Process -FilePath $binary.FullName -PassThru -WindowStyle Minimized
          Write-Host "Process ID: $($proc.Id)"
          Write-Host "Waiting 15s for stability check..."
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            Write-Host "SMOKE TEST FAILED: App exited with code $($proc.ExitCode) after $((Get-Date) - $proc.StartTime) seconds"
            exit 1
          }
          Write-Host "SMOKE TEST PASSED: App running stable for 15+ seconds"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      # ---- Plan B: WebDriver E2E test against real Tauri Windows app ----
      - name: Install tauri-driver
        if: matrix.os == 'windows-latest'
        run: cargo install tauri-driver --locked

      - name: WebDriver E2E test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TAURI_DRIVER_APP_PATH: ${{ github.workspace }}/src-tauri/target/${{ matrix.target }}/release/markhere.exe
        run: node e2e/webdriver-test.mjs

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-linux
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-macos
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-windows
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore
