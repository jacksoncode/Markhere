name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}

      # ---- Plan A: Windows smoke test (install MSI, launch, verify stability) ----
      - name: Smoke test - install MSI and launch app
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { Write-Host "No MSI found"; exit 1 }
          Write-Host "Installing $($msi.Name)..."
          msiexec /i "$msi" /qn /norestart
          Start-Sleep -Seconds 5
          Write-Host "Launching Markhere..."
          $proc = Start-Process "C:\Program Files\Markhere\Markhere.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            Write-Host "SMOKE TEST FAILED: App exited with code $($proc.ExitCode)"
            exit 1
          }
          Write-Host "SMOKE TEST PASSED: App running stable for 15 seconds"
          Stop-Process -Name "Markhere" -Force -ErrorAction SilentlyContinue

      # ---- Plan B: WebDriver E2E test against real Tauri Windows app ----
      - name: Install tauri-driver
        if: matrix.os == 'windows-latest'
        run: cargo install tauri-driver --locked

      - name: WebDriver E2E test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TAURI_DRIVER_APP_PATH: ${{ github.workspace }}/src-tauri/target/${{ matrix.target }}/release/markhere.exe
        run: node e2e/webdriver-test.mjs

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-linux
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-macos
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-windows
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore
