name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}

      # ---- Plan A: Windows smoke test (launch binary directly, verify stability) ----
      - name: Check binary dependencies
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $binary = Get-ChildItem "src-tauri/target" -Recurse -Filter "markhere.exe" |
            Where-Object { $_.FullName -match 'release' } |
            Select-Object -First 1
          if (-not $binary) {
            Write-Host "Binary not found — listing all exes:"
            Get-ChildItem "src-tauri/target" -Recurse -Filter "*.exe" | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          Write-Host "Binary: $($binary.FullName) ($([math]::Round($binary.Length/1MB,2)) MB)"
          Write-Host "Checking DLL dependencies..."
          & "dumpbin" /dependents $binary.FullName 2>$null | Select-String -Pattern "\.dll" | ForEach-Object { Write-Host "  $_" }
          Write-Host "Finished dependency check"

      - name: Smoke test - launch app and verify stability
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          RUST_BACKTRACE: full
        run: |
          $ErrorActionPreference = "Continue"
          $binary = Get-ChildItem "src-tauri/target" -Recurse -Filter "markhere.exe" |
            Where-Object { $_.FullName -match 'release' } |
            Select-Object -First 1
          Write-Host "Launching: $($binary.FullName)"
          $stderrLog = Join-Path $env:RUNNER_TEMP "markhere-stderr.log"
          $stdoutLog = Join-Path $env:RUNNER_TEMP "markhere-stdout.log"

          # Try running with stderr capture, no window needed
          $proc = Start-Process -FilePath $binary.FullName -PassThru `
            -RedirectStandardError $stderrLog `
            -RedirectStandardOutput $stdoutLog

          Write-Host "PID: $($proc.Id), waiting 10s..."
          Start-Sleep -Seconds 10

          if ($proc.HasExited) {
            Write-Host "!!! CRASHED after $([math]::Round(($proc.ExitTime - $proc.StartTime).TotalSeconds, 1))s, exit code: $($proc.ExitCode)"
            Write-Host "--- STDERR ---"
            if (Test-Path $stderrLog) { Get-Content $stderrLog | ForEach-Object { Write-Host $_ } } else { Write-Host "(empty)" }
            Write-Host "--- STDOUT ---"
            if (Test-Path $stdoutLog) { Get-Content $stdoutLog | ForEach-Object { Write-Host $_ } } else { Write-Host "(empty)" }
            exit 1
          }
          Write-Host "PASSED: App running for 10+ seconds"
          Write-Host "--- STDERR (so far) ---"
          if (Test-Path $stderrLog) { Get-Content $stderrLog | ForEach-Object { Write-Host $_ } } else { Write-Host "(empty)" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      # ---- Plan B: WebDriver E2E test against real Tauri Windows app ----
      - name: Install tauri-driver
        if: matrix.os == 'windows-latest'
        run: cargo install tauri-driver --locked

      - name: WebDriver E2E test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TAURI_DRIVER_APP_PATH: ${{ github.workspace }}/src-tauri/target/${{ matrix.target }}/release/markhere.exe
        run: node e2e/webdriver-test.mjs

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-linux
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-macos
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: markhere-windows
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore
