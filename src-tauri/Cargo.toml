[package]
name = "markhere"
version = "1.1.0-alpha"
description = "A modern WYSIWYG Markdown editor"
authors = ["markhere-team"]
edition = "2021"

[lib]
name = "markhere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
printpdf = "0.7"
docx-rs = "0.4"
html2text = "0.12"
git2 = "0.18"
reqwest = { version = "0.11", features = [] }
sysinfo = "0.30"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", features = ["rustls-tls"] }
arboard = { version = "3.4", features = ["image-data"] }

[dev-dependencies]
tempfile = "3.8"

[profile.release]
panic = "unwind"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

# Limit parallelism on CI to avoid OOM on Windows runners (7GB limit)
# Set CARGO_BUILD_JOBS=2 in CI environment for Windows builds

# ── Tauri Mobile (iOS / Android) ──
# Build target: cargo tauri android init / cargo tauri ios init
[target.aarch64-apple-ios.dependencies]
image = { version = "0.25", optional = true }

[target.aarch64-linux-android.dependencies]
image = { version = "0.25", optional = true }
