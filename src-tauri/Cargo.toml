[package]
name = "markhere"
version = "1.1.1"
description = "A modern WYSIWYG Markdown editor"
authors = ["markhere-team"]
edition = "2021"

[lib]
name = "markhere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "io-util"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# printpdf 0.7 pulls lopdf 0.31 which carries RUSTSEC-2026-0187 (stack overflow
# in `load_mem` PDF parser). Kept on 0.7 because:
#   1. printpdf 0.9 still pins lopdf ^0.39 (fix is in 0.42, API-incompatible)
#   2. Markhere only WRITES PDFs via printpdf — never calls `load_mem`
# See SECURITY.md for full risk assessment.
printpdf = "0.7"
docx-rs = "0.4"
html2text = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sysinfo = "0.30"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
notify = "6"
notify-debouncer-mini = "0.4"
zip = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", features = ["rustls-tls"] }
arboard = "3.4"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
